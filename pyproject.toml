[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zipfixx"
version = "0.1.0"
description = "CLI para corrigir e extrair arquivos ZIP com nomes Unicode no Windows."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SouzaF19" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
zipfix = "zipflix.cli:main"

[tool.setuptools]
packages = ["zipflix"]
